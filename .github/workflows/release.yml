name: Release Binaries

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-C strip=debuginfo"
  SCCACHE_GHA_ENABLED: "true"
  RELEASE_BENCH_INFLIGHT_VALUES: "1 2"
  RELEASE_BENCH_CHUNK_VALUES: "auto 4096"
  RELEASE_BENCH_SIMD_MODES: "off on"
  RELEASE_BENCH_SUMMARY_LINES: "12"

jobs:
  build:
    name: Build ${{ matrix.variant }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            variant: cpu
            cargo_features: ""
            artifact_name: organum-windows-cpu
            asset_extension: .exe
            archive_format: zip
          - os: windows-latest
            variant: cpu-gpu
            cargo_features: "--features gpu-warp"
            artifact_name: organum-windows-cpu-gpu
            asset_extension: .exe
            archive_format: zip
          - os: ubuntu-latest
            variant: cpu
            cargo_features: ""
            artifact_name: organum-linux-cpu
            asset_extension: ""
            archive_format: tar.gz
          - os: ubuntu-latest
            variant: cpu-gpu
            cargo_features: "--features gpu-warp"
            artifact_name: organum-linux-cpu-gpu
            asset_extension: ""
            archive_format: tar.gz
          - os: macos-latest
            variant: cpu
            cargo_features: ""
            artifact_name: organum-macos-cpu
            asset_extension: ""
            archive_format: tar.gz
          - os: macos-latest
            variant: cpu-gpu
            cargo_features: "--features gpu-warp"
            artifact_name: organum-macos-cpu-gpu
            asset_extension: ""
            archive_format: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}-${{ matrix.variant }}

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Build organum engine and caching-tool
        run: cargo build --release --workspace ${{ matrix.cargo_features }}



      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/release/organum-resampler${{ matrix.asset_extension }} artifacts/
          cp target/release/organum-wavtool${{ matrix.asset_extension }} artifacts/
          cp target/release/caching-tool${{ matrix.asset_extension }} artifacts/
          printf "%s\n" "${{ matrix.variant }}" > artifacts/BUILD_VARIANT.txt

      - name: Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/* -DestinationPath ${{ matrix.artifact_name }}.zip
          New-Item -ItemType Directory -Force final-artifact
          Move-Item ${{ matrix.artifact_name }}.zip final-artifact/

      - name: Archive (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd artifacts && tar -czvf ../${{ matrix.artifact_name }}.tar.gz ./* && cd ..
          mkdir -p final-artifact
          mv ${{ matrix.artifact_name }}.tar.gz final-artifact/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-archive
          path: final-artifact/*

  validate-assets:
    name: Validate release assets
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Validate expected archive count and names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp all-artifacts/*/* release-assets/
          ls -1 release-assets

          expected=6
          actual=$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$actual" -ne "$expected" ]; then
            echo "Expected $expected archives, found $actual"
            exit 1
          fi

          test -f release-assets/organum-windows-cpu.zip
          test -f release-assets/organum-windows-cpu-gpu.zip
          test -f release-assets/organum-linux-cpu.tar.gz
          test -f release-assets/organum-linux-cpu-gpu.tar.gz
          test -f release-assets/organum-macos-cpu.tar.gz
          test -f release-assets/organum-macos-cpu-gpu.tar.gz

  release:
    name: Create Release
    needs: [build, validate-assets]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Package Release
        run: |
          mkdir -p release-assets
          cp all-artifacts/*/* release-assets/

      - name: Install Rust for benchmark run
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies (release benchmark)
        uses: Swatinem/rust-cache@v2
        with:
          key: release-benchmark

      - name: Run latest benchmark for release notes
        shell: bash
        run: |
          set -euo pipefail
          for mode in ${RELEASE_BENCH_SIMD_MODES}; do
            PROFILE=release \
            OUTPUT_DIR="bench-results/simd-${mode}" \
            INFLIGHT_VALUES="${RELEASE_BENCH_INFLIGHT_VALUES}" \
            CHUNK_VALUES="${RELEASE_BENCH_CHUNK_VALUES}" \
            ORGANUM_AP_SIMD="${mode}" \
            bash scripts/run-bench.sh
          done

          eval "$(python3 - <<'PY'"
          import os
          import shlex
          from pathlib import Path

          def latest_pair(base: Path):
              summaries = sorted(base.glob("*.summary.txt"), key=lambda p: p.stat().st_mtime, reverse=True)
              logs = sorted(
                  [p for p in base.glob("bench-*.txt") if not p.name.endswith(".summary.txt")],
                  key=lambda p: p.stat().st_mtime,
                  reverse=True,
              )
              if not summaries:
                  raise SystemExit(f"no benchmark summary generated in {base}")
              summary = summaries[0]
              log = logs[0] if logs else None
              return summary, log

          off_summary, off_log = latest_pair(Path("bench-results/simd-off"))
          on_summary, on_log = latest_pair(Path("bench-results/simd-on"))

          env_path = Path(os.environ["GITHUB_ENV"])
          exports = []
          with env_path.open("a", encoding="utf-8") as f:
              f.write(f"RELEASE_BENCH_SUMMARY_OFF={off_summary.as_posix()}\n")
              f.write(f"RELEASE_BENCH_SUMMARY_ON={on_summary.as_posix()}\n")
              exports.append(("RELEASE_BENCH_SUMMARY_OFF", off_summary.as_posix()))
              exports.append(("RELEASE_BENCH_SUMMARY_ON", on_summary.as_posix()))
              if off_log:
                  f.write(f"RELEASE_BENCH_LOG_OFF={off_log.as_posix()}\n")
                  exports.append(("RELEASE_BENCH_LOG_OFF", off_log.as_posix()))
              if on_log:
                  f.write(f"RELEASE_BENCH_LOG_ON={on_log.as_posix()}\n")
                  exports.append(("RELEASE_BENCH_LOG_ON", on_log.as_posix()))

          for key, value in exports:
              print(f"{key}={shlex.quote(value)}")
          PY
          )"

          cp "${RELEASE_BENCH_SUMMARY_OFF}" release-assets/
          cp "${RELEASE_BENCH_SUMMARY_ON}" release-assets/
          if [ -n "${RELEASE_BENCH_LOG_OFF:-}" ]; then
            cp "${RELEASE_BENCH_LOG_OFF}" release-assets/
          fi
          if [ -n "${RELEASE_BENCH_LOG_ON:-}" ]; then
            cp "${RELEASE_BENCH_LOG_ON}" release-assets/
          fi

      - name: Generate release notes body
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Binaries

          This release provides both variants per platform:

          - `*-cpu`: default CPU build
          - `*-cpu-gpu`: build with `gpu-warp` feature enabled

          ### Assets

          - `organum-windows-cpu.zip`
          - `organum-windows-cpu-gpu.zip`
          - `organum-linux-cpu.tar.gz`
          - `organum-linux-cpu-gpu.tar.gz`
          - `organum-macos-cpu.tar.gz`
          - `organum-macos-cpu-gpu.tar.gz`
          EOF

          if [ -n "${RELEASE_BENCH_SUMMARY_OFF:-}" ] && [ -f "${RELEASE_BENCH_SUMMARY_OFF}" ]; then
            {
              echo
              echo "## Latest Benchmark (ORGANUM_AP_SIMD=off)"
              echo
              if [ -n "${RELEASE_BENCH_LOG_OFF:-}" ]; then
                echo "- Full log asset: \\`${RELEASE_BENCH_LOG_OFF##*/}\\`"
              fi
              echo "- Summary asset: \\`${RELEASE_BENCH_SUMMARY_OFF##*/}\\`"
              echo
              echo '\```text'
              sed -n "1,${RELEASE_BENCH_SUMMARY_LINES}p" "${RELEASE_BENCH_SUMMARY_OFF}"
              echo '\```'
            } >> RELEASE_NOTES.md
          fi

          if [ -n "${RELEASE_BENCH_SUMMARY_ON:-}" ] && [ -f "${RELEASE_BENCH_SUMMARY_ON}" ]; then
            {
              echo
              echo "## Latest Benchmark (ORGANUM_AP_SIMD=on)"
              echo
              if [ -n "${RELEASE_BENCH_LOG_ON:-}" ]; then
                echo "- Full log asset: \\`${RELEASE_BENCH_LOG_ON##*/}\\`"
              fi
              echo "- Summary asset: \\`${RELEASE_BENCH_SUMMARY_ON##*/}\\`"
              echo
              echo '\```text'
              sed -n "1,${RELEASE_BENCH_SUMMARY_LINES}p" "${RELEASE_BENCH_SUMMARY_ON}"
              echo '\```'
            } >> RELEASE_NOTES.md
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
