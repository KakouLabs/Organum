[workspace]
members = [".", "caching-tool", "world"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
hound = "3.5"
rubato = "0.15"
world = { path = "world" }
rayon = "1.11.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zstd = "0.13.3"
wgpu = "0.20"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }

[package]
name = "organum"
version = "0.0.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/KakouLabs/Organum"
authors = ["KYURAE KIM <mootomgame@gmail.com>"]

[features]
default = []
gpu-warp = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
serde = { workspace = true }
serde_json = "1.0"
serde_yaml = "0.9"
hound = { workspace = true }
rubato = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
world = { workspace = true }
rayon = { workspace = true }
zstd = { workspace = true }
getrandom = "0.4.2"
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[[bin]]
name = "organum-resampler"
path = "src/bin/resampler.rs"

[[bin]]
name = "organum-wavtool"
path = "src/bin/wavtool.rs"

[[bin]]
name = "warp-bench"
path = "src/bin/bench/warp-bench.rs"

[[bin]]
name = "ap-bench"
path = "src/bin/bench/ap-bench.rs"

[[bin]]
name = "world-bench"
path = "src/bin/bench/world-bench.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false
incremental = false

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.release.package.world]
opt-level = 3
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false

[profile.profiling.package.world]
opt-level = 3
codegen-units = 1
debug = true
debug-assertions = false
overflow-checks = false
